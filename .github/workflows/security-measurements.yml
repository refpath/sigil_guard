name: Security and performance measurements

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - run: mix deps.get
      - run: ./bin/check-security-mutations
        env:
          MIX_ENV: test
      - run: ./bin/check-jcs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-mutation-reports
          path: _build/security-mutations/

  comparable-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      - name: Measure parent and current code on the same machine
        run: |
          git worktree add --detach ../sigil-benchmark-parent HEAD^
          (cd ../sigil-benchmark-parent && mix deps.get && mix bench)
          mix deps.get
          mix bench
          cp ../sigil-benchmark-parent/bench/output/benchmarks.json bench/output/parent-benchmarks.json
          mix run bench/compare.exs --baseline bench/output/parent-benchmarks.json --run bench/output/benchmarks.json --require-comparable
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: comparable-performance-reports
          path: |
            bench/output/benchmarks.json
            bench/output/parent-benchmarks.json
