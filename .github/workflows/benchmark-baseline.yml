name: Benchmark baseline candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Revision to measure; empty measures the workflow ref
        required: false
        default: ""

permissions:
  contents: read

jobs:
  baseline-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.20"
          otp-version: "29"
      # Three consecutive full runs on this one runner. CI=false keeps the
      # harness out of smoke mode.
      - name: Measure three consecutive runs
        env:
          CI: "false"
          REF: ${{ inputs.ref }}
        run: |
          sha=$(git rev-parse --verify --end-of-options "${REF:-HEAD}^{commit}")
          git checkout --detach "$sha"
          mkdir -p bench/output/candidate
          printf 'revision %s\n' "$sha" | tee bench/output/candidate/revision.txt >> "$GITHUB_STEP_SUMMARY"
          mix deps.get
          for run in 1 2 3; do
            rm -f bench/output/benchmarks.json
            mix bench
            cp bench/output/benchmarks.json "bench/output/candidate/run-${run}.json"
          done
      # The candidate baseline is the last run, written only when every
      # scenario median of the three lies within +/-5% of their mean.
      # The findings go to stderr; keep them in the artifact and the summary
      # whether the check passes or fails.
      - name: Check the band and write the candidate baseline
        shell: bash
        run: |
          status=0
          mix run bench/compare.exs \
            --band bench/output/candidate/run-1.json \
            --band bench/output/candidate/run-2.json \
            --band bench/output/candidate/run-3.json \
            --write-baseline bench/output/candidate/baseline.json \
            > bench/output/candidate/band.txt 2>&1 || status=$?
          tee -a "$GITHUB_STEP_SUMMARY" < bench/output/candidate/band.txt
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: benchmark-baseline-candidate
          path: |
            bench/output/candidate/
            bench/output/*.md
